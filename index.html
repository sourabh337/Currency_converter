<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="converter">
            <h1>Currency Converter</h1>
            <p class="subtitle">Convert currencies with ease</p>

            <div class="amount-box">
                <label for="amount">Enter Amount</label>
                <input type="number" id="amount" value="1000" min="0">
            </div>

            <div class="currency-box">

                <div class="currency">
                    <label for="fromCurrency">From</label>
                    <select id="fromCurrency">
                        <option value="INR">INR - Indian Rupee</option>
                        <option value="USD">USD - US Dollar</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="GBP">GBP - British Pound</option>
                        <option value="JPY">JPY - Japanese Yen</option>
                        <option value="AUD">AUD - Australian Dollar</option>
                        <option value="CAD">CAD - Canadian Dollar</option>
                        <option value="AED">AED - UAE Dirham</option>
                        <option value="CNY">CNY - Chinese Yuan</option>
                        <option value="SGD">SGD - Singapore Dollar</option>
                    </select>
                </div>

                <button id="swap" class="swap-btn">⇄</button>

                <div class="currency">
                    <label for="toCurrency">To</label>
                    <select id="toCurrency">
                        <option value="USD">USD - US Dollar</option>
                        <option value="INR">INR - Indian Rupee</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="GBP">GBP - British Pound</option>
                        <option value="JPY">JPY - Japanese Yen</option>
                        <option value="AUD">AUD - Australian Dollar</option>
                        <option value="CAD">CAD - Canadian Dollar</option>
                        <option value="AED">AED - UAE Dirham</option>
                        <option value="CNY">CNY - Chinese Yuan</option>
                        <option value="SGD">SGD - Singapore Dollar</option>
                    </select>
                </div>

            </div>

            <button id="convert" class="convert-btn">Convert Currency</button>

            <div class="result-box">
                <p class="result-label">Converted Amount</p>
                <h2 id="result">Result will appear here</h2>
                <p id="rate">Exchange rate will appear here</p>
                <p id="message"></p>
            </div>

            <p class="footer">
                Rates provided by
                <a href="https://www.exchangerate-api.com" target="_blank">
                    ExchangeRate-API
                </a>
            </p>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
